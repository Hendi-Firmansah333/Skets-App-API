version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: skets-db
    environment:
      POSTGRES_USER: skets_user
      POSTGRES_PASSWORD: skets_password
      POSTGRES_DB: skets_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: skets-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  minio:
    image: minio/minio
    container_name: skets-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: skets_admin
      MINIO_ROOT_PASSWORD: skets_minio_password
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
